<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>高速公路广告牌管理系统</title>
<link rel="stylesheet" href="/assets/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f5fbf'/><path d='M8 10h16v8H8z' fill='white' opacity='.92'/><rect x='14' y='18' width='4' height='6' fill='white' opacity='.7'/></svg>" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="9" rx="1.5" fill="currentColor" opacity=".9"/><rect x="10.5" y="14" width="3" height="6" fill="currentColor" opacity=".55"/><path d="M3 22h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".35"/></svg>
      </div>
      <div class="brand-text">
        <strong>高速广告牌管理</strong>
        <span>Billboard MS v1.0</span>
      </div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <div class="hint">
        <span class="dot"></span> 数据实时联动
      </div>
      <p>状态规则：新增隐患自动置为「待整改」，工单办结且无未整改隐患自动恢复「正常」。</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <span class="crumb-root">运营中心</span>
        <svg viewBox="0 0 24 24" class="sep"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <span id="pageTitle">运营概览</span>
      </div>
      <div class="topbar-right">
        <div class="clock" id="clock"></div>
        <div class="divider"></div>
        <div class="user">
          <div class="avatar">孙</div>
          <div class="user-meta">
            <strong>孙文翔</strong>
            <span>2025计科专本7班 · Forever</span>
          </div>
        </div>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<script src="/assets/app.js"></script>
</body>
</html>
